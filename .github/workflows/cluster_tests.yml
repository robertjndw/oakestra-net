name: Cluster Service Manager Test

on: push


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Write Mosquitto config
        run: |
          cat > /tmp/mosquitto.conf <<'EOF'
          listener 10003
          allow_anonymous true
          EOF

      - name: Start Mosquitto broker
        run: |
          docker run -d --name mqtt -p 11883:10003 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro \
            eclipse-mosquitto:2.0

      - name: Install dependencies
        working-directory: cluster-service-manager/service-manager
        run: |
          pip install -r requirements-test.txt

      - name: Run test suite
        working-directory: cluster-service-manager/service-manager
        env:
          OAKESTRA_TEST_MQTT_ADDR: 127.0.0.1:11883
        run: |
           pytest -v
